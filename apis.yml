aid: leadout-capital
name: Leadout Capital
description: >-
  Leadout Capital is an early-stage venture capital fund headquartered in Portola Valley, California,
  founded in 2018 by Ali Rosenthal — an early Facebook business hire who drove growth of Facebook Mobile,
  later VP of Partnerships at Wealthfront, and previously of Goldman Sachs M&A and General Atlantic. The
  firm leads, co-leads, or takes a significant position in pre-seed and seed rounds, organizing its thesis
  around "founder-market fit": founders with a unique insight about a market, often born of the founding
  team's lived experience and their ability to build empathy with the customers they are innovating for.
  Leadout looks for products with strong network effects, unique data sets, organic and viral growth
  characteristics, great unit economics, and long-term defensibility. Its 46-company portfolio spans SaaS,
  vertical SaaS, marketplaces, healthcare, consumer and commerce, and infrastructure/developer tools, and
  includes Expo, Cloudsmith, Creatify AI, AtoB, R-Zero, Near Space Labs, Pavilion, Momentum, Axiom Cloud,
  and theCut. Leadout is a partner fund within Foundry Group's network-driven limited-partner model.
